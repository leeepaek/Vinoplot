<svg width="100%" height="100%" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="4" height="4">
            <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#000000" stroke-width="0.5" opacity="0.1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="800" height="800" fill="#f4f4f5" />

    <!-- Route des Grands Crus (Reference Line) -->
    <path d="M 420 0 Q 430 400 420 800" stroke="#71717a" stroke-width="6" fill="none" opacity="0.2" />

    <!-- Ruchottes-Chambertin (Upper Slope, North) -->
    <path id="ruchottes-chambertin" data-name="Ruchottes-Chambertin"
          d="M 200 80 L 320 70 L 330 140 L 210 150 L 190 120 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Mazis-Chambertin (Below Ruchottes, North of Bèze) -->
    <path id="mazis-chambertin" data-name="Mazis-Chambertin"
          d="M 320 70 L 480 60 L 490 180 L 330 190 L 330 140 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Chambertin-Clos de Bèze (Central, prestigious) -->
    <path id="chambertin-clos-de-beze" data-name="Chambertin-Clos de Bèze"
          d="M 210 150 L 330 140 L 330 190 L 420 185 L 415 350 L 200 340 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Chapelle-Chambertin (East of Bèze, lower slope) -->
    <path id="chapelle-chambertin" data-name="Chapelle-Chambertin"
          d="M 420 185 L 550 180 L 560 280 L 420 290 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Griotte-Chambertin (Small, below Chapelle) -->
    <path id="griotte-chambertin" data-name="Griotte-Chambertin"
          d="M 420 290 L 560 280 L 550 340 L 415 350 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Chambertin (The King, South of Bèze) -->
    <path id="chambertin" data-name="Chambertin"
          d="M 200 340 L 415 350 L 410 520 L 190 510 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Charmes-Chambertin (Large area East of Chambertin) -->
    <path id="charmes-chambertin" data-name="Charmes-Chambertin"
          d="M 415 350 L 550 340 L 580 500 L 410 520 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Latricières-Chambertin (South of Chambertin) -->
    <path id="latricieres-chambertin" data-name="Latricières-Chambertin"
          d="M 190 510 L 410 520 L 400 600 L 220 590 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Mazoyères-Chambertin (South of Charmes) -->
    <path id="mazoyeres-chambertin" data-name="Mazoyères-Chambertin"
          d="M 410 520 L 580 500 L 570 650 L 400 600 Z"
          fill="#D4AF37" stroke="#78350f" stroke-width="1.5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

    <!-- Clos Saint-Jacques (Separate hill to the West) -->
    <path id="clos-saint-jacques" data-name="Clos Saint-Jacques"
          d="M 50 200 L 150 190 L 160 300 L 60 310 Z"
          fill="#FB923C" stroke="#78350f" stroke-width="1.5" stroke-dasharray="5,5" class="vineyard-parcel transition-all duration-300 hover:opacity-80" />

</svg>
